<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1d2a">
<title>Bajans vs Tourists</title>
<style>
  html,body{margin:0;height:100%;background:#0b1d2a;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #wrap{display:flex;flex-direction:column;height:100%;align-items:center;justify-content:center}
  canvas{width:min(100vw,calc((100dvh - 90px) * 16 / 9));aspect-ratio:16/9;background:#000;display:block;border-radius:6px}
  #hint{font-size:12px;opacity:.65;margin-top:8px;text-align:center;padding:0 10px}
  #pad{display:none;position:fixed;left:0;right:0;bottom:8px;justify-content:space-between;padding:0 10px;box-sizing:border-box;pointer-events:none}
  #pad .g{display:flex;flex-wrap:wrap;max-width:140px;justify-content:center}
  #pad button{pointer-events:auto;width:60px;height:60px;margin:3px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(10,20,30,.45);color:#fff;font-size:24px;touch-action:none}
  #pad button.on{background:rgba(255,255,255,.4)}
  @media (pointer:coarse){#pad{display:flex}#hint{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="450"></canvas>
  <div id="hint">A/D or ←/→ move · W/↑/Space jump · S/↓ block · J punch · K kick · L special · M mute</div>
</div>
<div id="pad">
  <div class="g"><button data-a="left">◀</button><button data-a="right">▶</button><button data-a="jump">⬆</button><button data-a="block">🛡</button></div>
  <div class="g"><button data-a="punch">👊</button><button data-a="kick">🦶</button><button data-a="special">⭐</button></div>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=800,H=450,GY=372;

/* ---------- input ---------- */
const keys={},pressed={};
const KMAP={left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],jump:['KeyW','ArrowUp','Space'],block:['KeyS','ArrowDown'],punch:['KeyJ','KeyZ'],kick:['KeyK','KeyX'],special:['KeyL','KeyC']};
for(const a in KMAP)KMAP[a].push('T_'+a);
const isDown=a=>KMAP[a].some(c=>keys[c]);
const isHit=a=>KMAP[a].some(c=>pressed[c]);
addEventListener('keydown',e=>{
  if(!e.repeat)pressed[e.code]=true;
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='KeyM')muted=!muted;
});
addEventListener('keyup',e=>{keys[e.code]=false});
document.querySelectorAll('#pad button').forEach(b=>{
  const k='T_'+b.dataset.a;
  const on=e=>{e.preventDefault();keys[k]=true;pressed[k]=true;b.classList.add('on')};
  const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','pointerout','pointerleave'].forEach(t=>b.addEventListener(t,off));
});
addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- audio ---------- */
let ac,muted=false;
function sfx(f,d=.08,type='square',v=.05){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;g.gain.value=v;
    o.connect(g);g.connect(ac.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d);
  }catch(e){}
}

/* ---------- roster ---------- */
const BAJANS=[
  {id:'queen',type:'bajan',style:'queen',name:'ISLAND QUEEN',tag:'Glam. Fearless. Unbothered.',skin:'#8a5a3c',hair:'#1b1210',top:'#ff3d8b',bottom:'#ffd23f',boot:'#fff',special:'WINE WAVE!',proj:'wave',spd:3.6,dmg:1},
  {id:'don',type:'bajan',style:'don',name:'BAJAN DON',tag:'Smooth. Gold chains. Cold.',skin:'#6b4430',hair:'#150d0a',top:'#12b5a6',bottom:'#1c1c24',shoe:'#f2f2f2',special:'FLYING FISH!',proj:'fish',spd:3.4,dmg:1.05}
];
const TOURISTS=[
  {type:'tourist',name:'GARY from Stoke',skin:'#f0b29c',top:'#f4f4f4',shirt:'flag',shorts:'#b9a878',sock:'#c8102e',hat:'bucket',hatCol:'#e8dcae',shoeAccent:'#c8102e',special:'FLYING PINT!',proj:'pint',spd:1.7,dmg:.8,hp:100,rest:55,aggr:.05,blk:.1},
  {type:'tourist',name:'SHARON from Essex',skin:'#f3b5a2',top:'#ff8fc4',shirt:'hawaii',shorts:'#7f9fb7',sock:'#2a8f6a',hat:'sun',hatCol:'#f7e7a3',shoeAccent:'#2a8f6a',special:'FLYING PINT!',proj:'pint',spd:2,dmg:.9,hp:110,rest:42,aggr:.07,blk:.18},
  {type:'tourist',name:'NIGEL the Lager Lord',skin:'#e9967f',top:'#f4f4f4',shirt:'football',shorts:'#4d6a43',sock:'#1d3b8b',hat:'none',zinc:true,shoeAccent:'#1d3b8b',special:'FLYING PINT!',proj:'pint',spd:2.3,dmg:1,hp:125,rest:32,aggr:.09,blk:.26}
];
const MOVES={
  punch:{dur:16,start:5,end:9,reach:62,dmg:8,kb:5},
  kick:{dur:25,start:8,end:13,reach:82,dmg:12,kb:9},
  special:{dur:28,start:12,end:12,dmg:16,kb:7}
};
const pick=a=>a[Math.random()*a.length|0];

/* ---------- state ---------- */
const G={state:'select',sel:0,frame:0,shake:0,banner:null,opp:0,round:1,pw:0,ew:0,time:3600,t:0,rw:null,p:null,e:null,char:null};
let projs=[],parts=[],texts=[],menuDummies=[];

function mk(def,x,face,player,o={}){
  const hp=o.hp||100;
  return {def,x,y:GY,vx:0,vy:0,face,hp,max:hp,spd:def.spd,dmgMul:def.dmg||1,act:null,cd:0,spcd:0,stun:0,
    stumble:0,stumbleDir:1,stumbleT:120+(Math.random()*120|0),blockT:0,blocking:false,walking:false,ground:true,
    flash:0,anim:Math.random()*100|0,koT:0,ko:false,player,rest:o.rest||40,aggr:o.aggr||.06,blk:o.blk||.1};
}
function say(x,y,s,col='#fff'){texts.push({x,y,s,col,t:50})}
function burst(x,y,col,n=8){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*6,t:24,col})}

function newOpponent(){G.pw=0;G.ew=0;G.round=1;startRound()}
function startRound(){
  const t=TOURISTS[G.opp];
  G.p=mk(G.char,200,1,true,{hp:100});
  G.e=mk(t,600,-1,false,{hp:t.hp,rest:t.rest,aggr:t.aggr,blk:t.blk});
  projs=[];parts=[];texts=[];
  G.state='intro';G.t=110;G.time=3600;G.banner=null;
}
function startMatch(i){G.char=BAJANS[i];G.opp=0;newOpponent();sfx(440,.15,'triangle',.08)}

/* ---------- combat ---------- */
function startAct(f,type){
  f.act={type,t:0,done:false,...MOVES[type]};
  f.cd=f.player?4:f.rest+(Math.random()*25|0);
  if(type==='special'){f.spcd=f.player?150:260;say(f.x,f.y-150,f.def.special,'#ffe14d')}
  sfx(type==='kick'?190:type==='punch'?300:520,.07,'square',.04);
}
function applyHit(t,sx,dir,dmg,kb){
  if(t.ko)return false;
  const blocked=t.blocking&&(sx-t.x)*t.face>0;
  if(blocked){
    dmg*=.15;kb*=.35;say(t.x,t.y-130,'BLOCK','#9fd4ff');sfx(120,.06,'triangle',.06);
  }else{
    if(t.stumble>0){dmg*=1.6}
    say(t.x,t.y-135,pick(t.player?['OI!','BLIMEY!','OW!']:['BAM!','WUH LOSS!','LICK!','BRAPP!']),t.player?'#ffd1d1':'#ffe14d');
    sfx(90,.1,'sawtooth',.07);G.shake=7;burst(t.x,t.y-70,t.player?'#ffd1d1':'#ffe14d');
    t.act=null;t.flash=8;t.vy=-4;t.stumble=0;
  }
  t.hp-=dmg;t.stun=blocked?7:15;t.vx=dir*kb;
  if(t.hp<=0){t.hp=0;t.ko=true;t.vx=dir*7;t.vy=-8;t.act=null;sfx(70,.4,'sawtooth',.09)}
  return true;
}
function spawnProj(f){
  const k=f.def.proj;
  projs.push({kind:k,owner:f,x:f.x+f.face*30,y:k==='wave'?GY-18:f.y-78,vx:f.face*(k==='wave'?6:k==='fish'?8:6),t:100,dmg:MOVES.special.dmg*f.dmgMul});
}
function tryHit(f,o,a){
  if(o.ko)return false;
  const dx=(o.x-f.x)*f.face,dy=Math.abs(o.y-f.y);
  if(dx>-10&&dx<a.reach+18&&dy<60)return applyHit(o,f.x,f.face,a.dmg*f.dmgMul,a.kb);
  return false;
}

function step(f,o,inp){
  f.anim++;
  f.vy+=.65;f.y+=f.vy;f.ground=false;
  if(f.y>=GY){f.y=GY;f.vy=0;f.ground=true}
  f.x+=f.vx;f.vx*=f.ground?.82:.98;
  f.x=Math.max(30,Math.min(W-30,f.x));
  if(f.cd>0)f.cd--;if(f.spcd>0)f.spcd--;if(f.flash>0)f.flash--;
  f.blocking=false;f.walking=false;
  if(f.ko){f.koT++;return}
  if(f.stun>0){f.stun--;return}
  if(f.stumble>0){
    f.stumble--;f.act=null;
    f.vx+=Math.sin(f.anim*.5)*.5+f.stumbleDir*.12;
    return;
  }
  if(f.act){
    const a=f.act;a.t++;
    if(!a.done&&a.t>=a.start&&a.t<=a.end){
      if(a.type==='special'){spawnProj(f);a.done=true}
      else if(tryHit(f,o,a))a.done=true;
    }
    if(a.t>=a.dur)f.act=null;
    return;
  }
  if(f.ground)f.face=o.x>=f.x?1:-1;
  f.blocking=!!inp.block&&f.ground;
  if(!f.blocking){
    if(inp.left){f.x-=f.spd;f.walking=true}
    if(inp.right){f.x+=f.spd;f.walking=true}
    if(inp.jump&&f.ground)f.vy=-13;
    if(inp.special&&f.spcd<=0)startAct(f,'special');
    else if(inp.kick&&f.cd<=0)startAct(f,'kick');
    else if(inp.punch&&f.cd<=0)startAct(f,'punch');
  }
}

function ai(f,o){
  const inp={};
  if(f.ko||f.stun>0||f.stumble>0||f.act)return inp;
  const d=o.x-f.x,ad=Math.abs(d);
  f.stumbleT--;
  if(f.stumbleT<=0&&f.ground){
    f.stumble=42+(Math.random()*30|0);f.stumbleDir=Math.random()<.5?-1:1;
    f.stumbleT=140+(Math.random()*200|0);
    say(f.x,f.y-150,pick(['WHOOPS!','STEADY ON!','OOPS-A-DAISY!','TOO MUCH LAGER!']),'#fff');
    return inp;
  }
  if(o.act&&o.act.t<3&&ad<120&&Math.random()<f.blk*3)f.blockT=22;
  if(f.blockT>0){f.blockT--;inp.block=true;return inp}
  if(ad>78){if(d>0)inp.right=true;else inp.left=true}
  else if(ad<40&&Math.random()<.03){if(d>0)inp.left=true;else inp.right=true}
  if(f.cd<=0){
    if(ad<85&&Math.random()<f.aggr*2)inp[Math.random()<.4?'kick':'punch']=true;
    else if(ad>220&&f.spcd<=0&&Math.random()<.015)inp.special=true;
  }
  if(f.ground&&Math.random()<.004)inp.jump=true;
  return inp;
}

function updateProjs(){
  for(const p of projs){
    p.x+=p.vx;p.t--;
    const tg=p.owner.player?G.e:G.p;
    if(tg.ko)continue;
    let hit=false;
    if(p.kind==='wave')hit=Math.abs(p.x-tg.x)<30&&tg.y>GY-35;
    else hit=Math.abs(p.x-tg.x)<26&&Math.abs(p.y-(tg.y-70))<55;
    if(hit){applyHit(tg,p.x,Math.sign(p.vx),p.dmg,7);p.t=0}
    if(p.x<-40||p.x>W+40)p.t=0;
  }
  projs=projs.filter(p=>p.t>0);
}

function fightUpdate(live){
  const p=G.p,e=G.e;
  const pin=live?{left:isDown('left'),right:isDown('right'),jump:isDown('jump'),block:isDown('block'),punch:isHit('punch'),kick:isHit('kick'),special:isHit('special')}:{};
  step(p,e,pin);
  step(e,p,live?ai(e,p):{});
  const dx=e.x-p.x;
  if(Math.abs(dx)<36&&Math.abs(e.y-p.y)<40){
    const push=(36-Math.abs(dx))/2*(dx>=0?1:-1);e.x+=push;p.x-=push;
  }
  updateProjs();
  for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.4;q.t--}
  parts=parts.filter(q=>q.t>0);
  for(const t of texts){t.t--;t.y-=.6}
  texts=texts.filter(t=>t.t>0);
}

function checkEnd(){
  const p=G.p,e=G.e;let w=null;
  if(p.ko&&e.ko)w='draw';else if(e.ko)w='p';else if(p.ko)w='e';
  else if(G.time<=0){const a=p.hp/p.max,b=e.hp/e.max;w=a>b?'p':b>a?'e':'draw'}
  if(!w)return;
  G.state='roundEnd';G.t=150;G.rw=w;
  if(w==='p')G.pw++;else if(w==='e')G.ew++;
  G.banner={text:(p.ko||e.ko)?'K.O.!':'TIME!',t:150};
}
function afterRound(){
  if(G.pw>=2){
    if(G.opp<TOURISTS.length-1){G.opp++;newOpponent()}
    else{G.state='win'}
  }else if(G.ew>=2){G.state='lose'}
  else{G.round++;startRound()}
}

/* ---------- update ---------- */
function toSelect(){G.state='select';menuDummies[0].anim=0}
function update(){
  G.frame++;
  const S=G.state;
  if(S==='select'){
    menuDummies.forEach(d=>d.anim++);
    if(isHit('left')||pressed.Digit1)G.sel=0;
    if(isHit('right')||pressed.Digit2)G.sel=1;
    if(pressed.Enter||pressed.Space||pressed.KeyJ||pressed.T_punch)startMatch(G.sel);
  }else if(S==='intro'){
    G.t--;fightUpdate(false);
    G.banner=G.t>45?{text:'ROUND '+G.round,sub:TOURISTS[G.opp].name,t:2}:{text:'FIGHT!',t:2};
    if(G.t<=0){G.state='fight';G.banner={text:'FIGHT!',t:30};sfx(660,.2,'square',.06)}
  }else if(S==='fight'){
    G.time--;fightUpdate(true);checkEnd();
    if(G.banner){G.banner.t--;if(G.banner.t<=0)G.banner=null}
  }else if(S==='roundEnd'){
    G.t--;fightUpdate(false);
    if(G.t<=0)afterRound();
  }else if(S==='win'||S==='lose'){
    fightUpdate(false);G.t++;
    if(G.t>40&&(pressed.Enter||pressed.Space||pressed.KeyJ||pressed.T_punch||tapped)){toSelect()}
  }
  if(S==='win'||S==='lose'){}else G.t=G.t;
  tapped=false;
}
let tapped=false;
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  if(G.state==='select'){
    if(y>100&&y<420){
      if(x>40&&x<350){G.sel=0;startMatch(0)}
      else if(x>450&&x<760){G.sel=1;startMatch(1)}
    }
  }else if(G.state==='win'||G.state==='lose'){tapped=true}
});
// winning/losing counter reuse

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r=2){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill()}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}

/* ---------- background ---------- */
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function buildBG(){
  const c=bg.getContext('2d');
  let g=c.createLinearGradient(0,0,0,250);g.addColorStop(0,'#4cc2ff');g.addColorStop(1,'#d6f4ff');
  c.fillStyle=g;c.fillRect(0,0,W,250);
  // sun
  g=c.createRadialGradient(650,70,5,650,70,70);g.addColorStop(0,'#fff6b0');g.addColorStop(.4,'#ffe14d');g.addColorStop(1,'rgba(255,225,77,0)');
  c.fillStyle=g;c.fillRect(560,0,200,160);
  // sea
  g=c.createLinearGradient(0,235,0,310);g.addColorStop(0,'#29b8e6');g.addColorStop(1,'#0b6fa8');
  c.fillStyle=g;c.fillRect(0,235,W,75);
  // sailboat
  c.fillStyle='#fff';c.beginPath();c.moveTo(250,238);c.lineTo(250,200);c.lineTo(280,238);c.fill();
  c.fillStyle='#ff4d4d';c.beginPath();c.moveTo(246,238);c.lineTo(246,212);c.lineTo(228,238);c.fill();
  c.fillStyle='#5a3a22';c.fillRect(222,238,64,5);
  // sand
  g=c.createLinearGradient(0,308,0,H);g.addColorStop(0,'#f6e2ae');g.addColorStop(1,'#e2c07a');
  c.fillStyle=g;c.fillRect(0,308,W,H-308);
  c.fillStyle='rgba(255,255,255,.35)';c.fillRect(0,306,W,5);
  // palm tree
  function palm(x,y,s){
    c.save();c.translate(x,y);c.scale(s,1);
    c.strokeStyle='#7a5230';c.lineWidth=14;c.lineCap='round';
    c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(26,-90,10,-170);c.stroke();
    c.strokeStyle='#5d3d22';c.lineWidth=3;
    for(let i=0;i<7;i++){c.beginPath();c.moveTo(-6,-i*24);c.lineTo(8+ i*1.5,-i*24-8);c.stroke()}
    c.fillStyle='#2f9e44';
    for(const a of [-2.7,-2.1,-1.5,-.9,-.3]){
      c.save();c.translate(10,-170);c.rotate(a);
      c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(40,-26,86,6);c.quadraticCurveTo(44,-6,0,0);c.fill();c.restore();
    }
    c.fillStyle='#6b4a1f';c.beginPath();c.arc(8,-164,6,0,7);c.arc(16,-160,6,0,7);c.fill();
    c.restore();
  }
  palm(80,330,1);palm(735,335,-1);
  // umbrella
  c.fillStyle='#8a6a3a';c.fillRect(300,262,4,56);
  const cols=['#e53935','#fff','#e53935','#fff','#e53935'];
  for(let i=0;i<5;i++){c.fillStyle=cols[i];c.beginPath();c.moveTo(302,230);c.lineTo(262+i*20,262);c.lineTo(282+i*20,262);c.fill()}
  // flag pole (Bajan flag)
  c.fillStyle='#ccc';c.fillRect(521,205,3,115);
  c.fillStyle='#00267f';c.fillRect(524,208,14,24);c.fillRect(552,208,14,24);
  c.fillStyle='#ffc726';c.fillRect(538,208,14,24);
  c.fillStyle='#000';c.font='bold 18px serif';c.textAlign='center';c.fillText('Ψ',545,226);
  // sign
  c.fillStyle='#8a5a30';c.fillRect(388,258,6,52);c.fillRect(436,258,6,52);
  c.fillStyle='#c78b4b';c.fillRect(366,232,98,34);
  c.strokeStyle='#6b4420';c.lineWidth=2;c.strokeRect(366,232,98,34);
  c.fillStyle='#2b1a0c';c.font='bold 11px system-ui';c.textAlign='center';
  c.fillText('WELCOME TO',415,246);c.fillText('BARBADOS',415,260);
})();
function drawBG(){
  ctx.drawImage(bg,0,0);
  const f=G.frame;
  ctx.fillStyle='rgba(255,255,255,.9)';
  for(let i=0;i<3;i++){
    const x=((i*300+f*(.1+i*.04))%1000)-120,y=40+i*35;
    ctx.beginPath();ctx.ellipse(x,y,40,12,0,0,7);ctx.ellipse(x+25,y-8,28,12,0,0,7);ctx.ellipse(x-22,y-4,24,10,0,0,7);ctx.fill();
  }
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;
  for(let i=0;i<12;i++){
    const x=(i*80+f*.6)%W,y=250+(i%4)*14;
    ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+10,y-4,x+20,y);ctx.stroke();
  }
}

/* ---------- fighter ---------- */
function drawFighter(f,sc=1){
  const d=f.def,tour=d.type==='tourist',a=f.act;
  const h=Math.max(0,GY-f.y);
  ctx.save();ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();
  ctx.ellipse(f.x,(f.shadowY||GY)+2,26*sc*(1-Math.min(.5,h/300)),6*sc,0,0,7);ctx.fill();ctx.restore();

  ctx.save();ctx.translate(f.x,f.y);ctx.scale(sc*f.face,sc);
  if(f.flash>0&&f.flash%4<2)ctx.filter='brightness(2.2)';

  let lean=0,legF=0,legB=0,armF=.15,armB=-.15,bob=0;
  const ph=f.anim*.28;
  let out=0;
  if(a){out=a.t<a.start?a.t/a.start:a.t<=a.end?1:Math.max(0,1-(a.t-a.end)/(a.dur-a.end))}
  if(f.ko){
    const k=Math.min(1,f.koT/14);ctx.translate(0,-6*k);ctx.rotate(-1.5*k);armF=-2.4;armB=-2;legF=.2;legB=-.2;
  }else if(f.stumble>0||f.stumbleDemo){
    const s=Math.sin(f.anim*.45);lean=s*.28;legF=Math.sin(ph*1.5)*.7;legB=-legF;
    armF=-1.2+Math.sin(f.anim*.6);armB=-1.2-Math.sin(f.anim*.6);
  }else if(f.stun>0){lean=-.2;armF=.8;armB=.5}
  else if(f.blocking){armF=-2.4;armB=-2.1;lean=.05}
  else if(a){
    if(a.type==='punch'){armF=-1.57*out;armB=-2;lean=.1*out}
    else if(a.type==='kick'){legF=-1.45*out;lean=-.12*out;armF=.6;armB=-1.6}
    else{armF=-1.57*out;armB=-1.4*out;lean=.05*out}
  }else if(!f.ground){legF=.6;legB=-.4;armF=-.6;armB=-.6}
  else if(f.walking){legF=Math.sin(ph)*.7;legB=-legF;armF=-legF*.7;armB=legF*.7}
  else{bob=Math.sin(f.anim*.1)*1.2;armF=.15+Math.sin(f.anim*.1)*.05}
  if(lean){ctx.translate(0,-48);ctx.rotate(lean);ctx.translate(0,48)}
  ctx.translate(0,bob);

  function leg(ang,ox){
    ctx.save();ctx.translate(ox,-48);ctx.rotate(ang);
    if(tour){
      ctx.fillStyle=d.shorts;rr(-8,-2,16,28,3);                 // long shorts
      ctx.fillStyle=d.skin;rr(-5,24,10,6,2);ctx.fillStyle='rgba(214,60,43,.5)';rr(-5,24,10,6,2);
      ctx.fillStyle='#fff';rr(-5.5,28,11,14,2);                  // high sock
      ctx.fillStyle=d.sock;ctx.fillRect(-5.5,30,11,2);ctx.fillRect(-5.5,34,11,2);
      ctx.fillStyle='#f6f6f6';rr(-8,39,27,9,4);                  // big sneakers
      ctx.fillStyle='#bbb';ctx.fillRect(-8,45,27,3);
      ctx.fillStyle=d.shoeAccent;ctx.fillRect(2,40,9,3);
    }else if(d.style==='queen'){
      ctx.fillStyle=d.bottom;rr(-7,-2,14,16,3);
      ctx.fillStyle=d.skin;rr(-5,13,10,24,3);
      ctx.fillStyle=d.boot;rr(-6,32,13,16,3);rr(-6,41,22,7,3);
      ctx.fillStyle='#ff3d8b';ctx.fillRect(-6,36,13,2);
    }else{
      ctx.fillStyle=d.bottom;rr(-8,-2,16,40,3);
      ctx.fillStyle=d.shoe;rr(-8,36,25,12,4);
      ctx.fillStyle='#ffc726';ctx.fillRect(4,38,7,2);
    }
    ctx.restore();
  }
  function arm(ang,ox){
    ctx.save();ctx.translate(ox,-96);ctx.rotate(ang);
    if(tour){
      ctx.fillStyle=d.top;rr(-5,-2,10,12,3);
      ctx.fillStyle=d.skin;rr(-4,9,8,18,3);
      ctx.fillStyle='rgba(214,60,43,.5)';rr(-4,9,8,12,3);
      ctx.fillStyle=d.skin;circ(0,29,5);
    }else if(d.style==='queen'){
      ctx.fillStyle=d.skin;rr(-4,-2,8,28,3);
      ctx.fillStyle='#ffd23f';rr(-4,18,8,3);rr(-4,22,8,2);
      ctx.fillStyle=d.skin;circ(0,29,5);
      ctx.fillStyle='#d3123b';ctx.fillRect(-3,26,6,2);
    }else{
      ctx.fillStyle=d.top;rr(-6,-2,12,24,3);
      ctx.fillStyle='#7ff3e6';rr(-6,18,12,6,3);
      ctx.fillStyle=d.skin;circ(0,29,5);
      ctx.fillStyle='#ffc726';ctx.fillRect(-4,25,8,2);
    }
    ctx.restore();
  }

  arm(armB,-4);leg(legB,-5);

  // torso
  if(tour){
    ctx.fillStyle=d.top;rr(-13,-102,26,56,5);
    ctx.beginPath();ctx.ellipse(6,-62,13,11,0,0,7);ctx.fill();
    if(d.shirt==='flag'){
      ctx.fillStyle='#1d3b8b';ctx.fillRect(-8,-92,18,12);
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-8,-92);ctx.lineTo(10,-80);ctx.moveTo(10,-92);ctx.lineTo(-8,-80);ctx.stroke();
      ctx.fillStyle='#fff';ctx.fillRect(-1,-92,4,12);ctx.fillRect(-8,-87,18,3);
      ctx.fillStyle='#c8102e';ctx.fillRect(0,-92,2,12);ctx.fillRect(-8,-86,18,1.5);
    }else if(d.shirt==='hawaii'){
      for(let i=0;i<9;i++){ctx.fillStyle=i%2?'#ffe14d':'#fff';circ(-8+(i%3)*8,-94+((i/3)|0)*13,3)}
      ctx.fillStyle='#2a8f6a';circ(8,-70,3);circ(-6,-60,3);
    }else{
      ctx.fillStyle='#c8102e';ctx.fillRect(-2,-102,4,56);ctx.fillRect(-13,-80,26,4);
    }
    ctx.fillStyle='rgba(214,60,43,.45)';ctx.beginPath();ctx.ellipse(0,-100,14,5,0,0,7);ctx.fill();
  }else if(d.style==='queen'){
    ctx.fillStyle=d.top;rr(-12,-102,24,22,5);
    ctx.fillStyle=d.skin;rr(-10,-80,20,16,2);
    ctx.fillStyle=d.bottom;rr(-11,-64,22,18,4);
    ctx.fillStyle='#fff';circ(0,-72,2);
  }else{
    ctx.fillStyle='#fff';rr(-9,-100,18,50,4);
    ctx.fillStyle=d.top;rr(-15,-104,30,64,6);
    ctx.fillStyle='#7ff3e6';rr(-15,-104,30,7,3);
    ctx.fillStyle=d.bottom;ctx.fillRect(-1,-95,2,52);
    ctx.strokeStyle='#ffc726';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(2,-98,9,.1,3.04);ctx.stroke();
    ctx.fillStyle='#ffc726';circ(2,-87,3.5);
  }

  // head
  ctx.fillStyle=d.skin;circ(3,-116,14);
  if(tour){
    ctx.fillStyle='rgba(224,74,58,.45)';circ(9,-112,6);circ(-2,-120,4);
    ctx.fillStyle='#c92a1f';circ(16,-114,4);
    if(d.zinc){ctx.fillStyle='#fff';ctx.fillRect(12,-118,7,3)}
    ctx.fillStyle='#fff';circ(9,-119,3.2);ctx.fillStyle='#1a1a1a';circ(10,-119,1.6);
    ctx.fillStyle='#7a2a20';ctx.fillRect(8,-107,6,1.5);
    if(d.hat==='bucket'){ctx.fillStyle=d.hatCol;rr(-10,-135,26,11,4);rr(-15,-127,36,4,2)}
    else if(d.hat==='sun'){ctx.fillStyle=d.hatCol;ctx.beginPath();ctx.ellipse(3,-126,26,5,0,0,7);ctx.fill();rr(-9,-138,24,13,6);ctx.fillStyle='#ff4fa0';ctx.fillRect(-9,-129,24,3)}
    else{ctx.fillStyle='#c9a36b';rr(-11,-124,6,8,2);ctx.fillStyle='rgba(224,74,58,.5)';ctx.beginPath();ctx.ellipse(3,-128,10,4,0,0,7);ctx.fill()}
  }else if(d.style==='queen'){
    ctx.fillStyle=d.hair;circ(-6,-124,12);circ(-14,-114,8);circ(-1,-139,8);
    ctx.fillStyle='#111';rr(3,-121,16,6,2);ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(6,-120,4,1.5);
    ctx.fillStyle='#d3123b';rr(10,-108,6,2.5,1);
    ctx.strokeStyle='#ffd23f';ctx.lineWidth=2;ctx.beginPath();ctx.arc(-4,-106,5,0,7);ctx.stroke();
  }else{
    ctx.fillStyle=d.hair;rr(-12,-132,26,11,5);
    ctx.strokeStyle=d.hair;ctx.lineWidth=3.5;ctx.lineCap='round';
    for(let i=0;i<4;i++){
      const sw=Math.sin(f.anim*.1+i)*2;
      ctx.beginPath();ctx.moveTo(-9+i*3,-124);ctx.quadraticCurveTo(-17-i*2+sw,-104,-15-i*3+sw,-84);ctx.stroke();
      ctx.fillStyle='#ffc726';circ(-15-i*3+sw,-84,1.8);
    }
    ctx.fillStyle='#111';rr(3,-121,16,6,2);ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(6,-120,4,1.5);
    ctx.fillStyle='#fff';ctx.fillRect(11,-108,5,2);
  }

  leg(legF,5);arm(armF,6);
  ctx.filter='none';
  ctx.restore();
}

function drawProj(p){
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(Math.sign(p.vx),1);
  if(p.kind==='wave'){
    for(let i=0;i<3;i++){
      ctx.strokeStyle=`rgba(255,61,139,${.9-i*.25})`;ctx.lineWidth=6-i;
      ctx.beginPath();ctx.arc(-6-i*10,0,16+i*7,-1.1,1.1);ctx.stroke();
    }
    ctx.fillStyle='#ffd23f';circ(10,0,3);
  }else if(p.kind==='fish'){
    ctx.rotate(Math.sin(p.t*.4)*.3);
    ctx.fillStyle='#ffc726';ctx.beginPath();ctx.ellipse(0,0,16,8,0,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(-26,-9);ctx.lineTo(-26,9);ctx.fill();
    ctx.fillStyle='#ff8a00';ctx.beginPath();ctx.ellipse(-2,-7,7,4,0,0,7);ctx.fill();
    ctx.fillStyle='#fff';circ(9,-2,3);ctx.fillStyle='#000';circ(10,-2,1.5);
  }else{
    ctx.rotate(p.t*.3);
    ctx.fillStyle='#f0a500';rr(-8,-10,16,20,3);
    ctx.fillStyle='#fff';rr(-9,-13,18,6,3);
    ctx.strokeStyle='#f0a500';ctx.lineWidth=3;ctx.beginPath();ctx.arc(10,0,5,-1.5,1.5);ctx.stroke();
  }
  ctx.restore();
}

/* ---------- screens ---------- */
function outlined(s,x,y,size,col='#fff',align='center'){
  ctx.font=`900 ${size}px system-ui,sans-serif`;ctx.textAlign=align;ctx.lineJoin='round';
  ctx.lineWidth=Math.max(3,size/7);ctx.strokeStyle='#14222e';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function drawScene(){
  const list=[G.p,G.e].sort((a,b)=>a.y-b.y);
  list.forEach(f=>drawFighter(f));
  projs.forEach(drawProj);
  parts.forEach(q=>{ctx.fillStyle=q.col;ctx.fillRect(q.x,q.y,5,5)});
  texts.forEach(t=>{ctx.globalAlpha=Math.min(1,t.t/20);outlined(t.s,t.x,t.y,t.s.length>8?16:22,t.col);ctx.globalAlpha=1});
}
function bar(x,w,f,flip,name){
  ctx.fillStyle='#14222e';rr(x-3,24,w+6,22,6);
  const pct=f.hp/f.max;
  ctx.fillStyle=pct>.5?'#3ddc6b':pct>.25?'#ffd23f':'#ff4d4d';
  const bw=w*pct;
  rr(flip?x+w-bw:x,27,bw,16,4);
  outlined(name,flip?x+w:x,19,14,'#fff',flip?'right':'left');
}
function pips(x,n,flip){
  for(let i=0;i<2;i++){
    ctx.fillStyle=i<n?'#ffd23f':'rgba(0,0,0,.35)';
    circ(x+(flip?-i:i)*18,58,6);
  }
}
function drawHUD(){
  bar(24,320,G.p,false,G.char.name);
  bar(456,320,G.e,true,G.e.def.name);
  pips(32,G.pw,false);pips(768,G.ew,true);
  outlined(String(Math.max(0,Math.ceil(G.time/60))),400,50,36,'#fff');
  outlined('TOURIST '+(G.opp+1)+'/3',400,70,12,'#ffe14d');
  if(G.banner){outlined(G.banner.text,400,200,64,'#ffe14d');if(G.banner.sub)outlined(G.banner.sub,400,236,22,'#fff')}
  if(G.state==='roundEnd'&&G.rw!=='draw'){
    outlined(G.rw==='p'?'BAJAN WINS THE ROUND':'TOURIST WINS THE ROUND',400,260,24,'#fff');
  }
}
function drawSelect(){
  outlined('BAJANS vs TOURISTS',400,60,46,'#ffe14d');
  outlined('Defend the island. Mind the sunburn.',400,88,16,'#fff');
  for(let i=0;i<2;i++){
    const d=BAJANS[i],x=i?450:40,sel=G.sel===i;
    ctx.fillStyle=sel?'rgba(255,255,255,.35)':'rgba(10,25,40,.35)';rr(x,108,310,310,14);
    ctx.strokeStyle=sel?'#ffe14d':'rgba(255,255,255,.4)';ctx.lineWidth=sel?4:2;
    ctx.beginPath();ctx.roundRect?ctx.roundRect(x,108,310,310,14):ctx.rect(x,108,310,310);ctx.stroke();
    const dm=menuDummies[i];dm.x=x+155;dm.y=345;dm.shadowY=345;
    drawFighter(dm,1.4);
    outlined(d.name,x+155,382,24,'#fff');
    outlined(d.tag,x+155,404,13,'#ffe14d');
  }
  const t=menuDummies[2];t.x=400;t.y=GY;t.shadowY=GY;drawFighter(t,.9);
  outlined('VS',400,250,40,'#ff6b6b');
  outlined('Tap a fighter  ·  or ←/→ then Enter',400,436,14,'#fff');
}
function drawEnd(){
  ctx.fillStyle='rgba(8,20,32,.55)';ctx.fillRect(0,0,W,H);
  if(G.state==='win'){
    outlined('BAJAN VICTORY!',400,140,56,'#ffe14d');
    outlined('The tourists have gone back to the all-inclusive. 🌴',400,180,18,'#fff');
  }else{
    outlined('SUNBURNT & DEFEATED',400,140,50,'#ff6b6b');
    outlined('The tourists took all the sun loungers. Try again!',400,180,18,'#fff');
  }
  if(G.t>40)outlined('Tap or press Enter',400,420,20,'#fff');
}

function draw(){
  ctx.save();
  if(G.shake>0){ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);G.shake*=.85;if(G.shake<.3)G.shake=0}
  drawBG();
  if(G.state==='select')drawSelect();
  else{drawScene();drawHUD();if(G.state==='win'||G.state==='lose')drawEnd()}
  ctx.restore();
}

/* ---------- boot ---------- */
menuDummies=[mk(BAJANS[0],0,1,true),mk(BAJANS[1],0,1,true),mk(TOURISTS[0],0,-1,false)];
menuDummies[2].stumbleDemo=true;
let last=0,acc=0;
function loop(ts){
  acc+=Math.min(100,ts-last);last=ts;
  while(acc>=16.67){update();acc-=16.67;for(const k in pressed)delete pressed[k]}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(ts=>{last=ts;loop(ts)});
})();
</script>
</body>
